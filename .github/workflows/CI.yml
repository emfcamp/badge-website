name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Build docs
        env:
          CI: ${{ github.ref == 'refs/heads/main' }}
        run: uv run mkdocs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Fetch Pages Artifact
        id: deployment
        uses: actions/download-artifact@v8
        with:
          name: github-pages

      - name: Unpack Pages Artifact
        run: |
          mkdir upload
          tar -C upload -xvf artifact.tar

      - name: Send to git-pages
        uses: docker://data.forgejo.org/git-pages/git-pages-cli:1.12.1
        env:
          GIT_PAGES_PASSWORD: ${{ secrets.GIT_PAGES_SECRET }}
        with:
          args: https://badge.emfcamp.org --upload-dir=upload
